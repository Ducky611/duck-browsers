<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111018">
<meta name="description" content="Play Duck’s arcade games, browse community libraries, and watch movies.">
<title>New Tab</title><script src="/js/new-tab.js" defer></script>
<link rel="icon" href="/duck.png">
<link rel="stylesheet" href="/arcade.css">
<link rel="stylesheet" href="/local-games.css">
<script type="module" src="/js/arcade.js"></script>
</head>
<body class="home">
<svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <symbol id="gamesIcon" viewBox="0 0 24 24"><path d="M8 7h8c2.1 0 3.5 1.5 4.1 3.8l1 5c.6 3.1-2.3 4-4.1 2l-2-2H9l-2 2c-1.8 2-4.7 1.1-4.1-2l1-5C4.4 8.5 5.9 7 8 7Z"/><path d="M8 9.5v4m-2-2h4m5.5-.6h.01m2.5 2.1h.01"/></symbol>
  <symbol id="searchIcon" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.7"/><path d="m16 16 4.4 4.4"/></symbol>
  <symbol id="movieIcon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7.5 5v14M16.5 5v14M3 10h4m-4 4h4m10-4h4m-4 4h4"/></symbol>
  <symbol id="globeIcon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></symbol>
  <symbol id="settingsIcon" viewBox="0 0 24 24"><path d="M3 7h8m4 0h6M3 17h3m4 0h11"/><circle cx="13" cy="7" r="2.5"/><circle cx="8" cy="17" r="2.5"/></symbol>
  <symbol id="expandIcon" viewBox="0 0 24 24"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></symbol>
</svg>
<header class="topbar"><div class="bar-inner">
  <a class="wordmark" href="/" aria-label="Duck home" data-route><img src="/duck.png" alt=""><span>Duck</span></a>
  <nav aria-label="Main navigation">
    <a href="/games" data-route><svg><use href="#gamesIcon"/></svg>Games</a>
    <a href="/movies" data-route><svg><use href="#movieIcon"/></svg>Movies</a>
    <a href="/browser"><svg><use href="#globeIcon"/></svg>Browser</a>
  </nav>
  <button class="icon-button" id="settingsButton" type="button" title="Settings" aria-label="Settings"><svg><use href="#settingsIcon"/></svg></button>
</div></header>
<main>
  <section id="homeView">
    <div class="hero"><div class="hero-inner">
      <h1>Duck</h1>
      <form id="homeSearch" role="search" action="/browser"><svg><use href="#searchIcon"/></svg><input type="search" name="url" aria-label="Search DuckDuckGo or enter a website" placeholder="Search DuckDuckGo or enter a URL" autocomplete="off" spellcheck="false" required><button type="submit" aria-label="Search the web">Go</button></form>
    </div></div>
  </section>
  <section id="libraryView" class="content shelf" hidden>
    <div class="library-header"><div><a class="breadcrumb" href="/" data-route>Duck Arcade</a><h1 id="libraryTitle">Games</h1></div><div id="totalCount"></div></div>
    <div class="tools"><label class="search"><svg><use href="#searchIcon"/></svg><input type="search" id="search" aria-label="Search the library" placeholder="Search games…" autocomplete="off"><kbd>/</kbd></label>
      <label class="select-wrap"><span class="sr-only">Library</span><select id="source"></select></label>
      <label class="select-wrap"><span class="sr-only">Sort order</span><select id="sort"><option value="featured">Featured first</option><option value="az">Title A–Z</option><option value="za">Title Z–A</option></select></label>
    </div>
    <div class="catalog-info"><span id="resultCount" role="status"></span><span id="feedError" hidden></span><button id="retry" type="button" hidden>Retry catalogs</button></div>
    <div id="catalog" class="cards"></div><div id="empty" hidden><h2>No matches</h2><p>Try another title or library.</p><button type="button" id="clearFilters">Clear filters</button></div>
    <nav class="pages" id="pages" aria-label="Game pages" hidden><button type="button" id="previous">Previous</button><span id="pageNumber"></span><button type="button" id="next">Next</button></nav>
  </section>
</main>
<footer class="site-footer"><a href="/" class="wordmark" data-route><img src="/duck.png" alt=""><span>Duck</span></a><span>Arcade &amp; Cinema</span><a href="/games?source=LOCAL" data-route>Built-in games</a></footer>
<section id="player" class="player" hidden aria-label="Player"><header class="player-toolbar">
  <button id="back" type="button" aria-label="Back to library"><span aria-hidden="true">‹</span> Back</button>
  <div class="playing-title"><small id="playerSource"></small><select id="versions" aria-label="Game version" hidden></select><h1 id="playerTitle" tabindex="-1"></h1></div>
  <label id="movieSources" class="select-wrap" hidden><span class="sr-only">Playback source</span><select id="movieSource" aria-label="Playback source"></select></label>
  <a id="original" target="_blank" rel="noopener noreferrer" hidden>Original</a>
  <button id="restart" type="button" title="Restart" aria-label="Restart">↻</button>
  <button id="fullscreen" type="button" title="Fullscreen" aria-label="Fullscreen"><svg><use href="#expandIcon"/></svg></button>
</header><div id="playArea" class="play-area"></div></section>
<dialog id="settings"><form method="dialog"><div class="section-heading"><h2>Settings</h2><button class="icon-button" aria-label="Close settings">×</button></div><label class="setting"><span>Animate the home scene</span><input id="motion" type="checkbox"></label><a href="/logout">Sign out</a></form></dialog>
<noscript><p>Enable JavaScript to open the Duck arcade.</p></noscript>
</body></html>
